name: ci

# Build and test everything on every push and pull request. Pushes to main and
# version tags (v*) also publish multi-arch images to GHCR:
#   ghcr.io/4evrd/evrd      the daemon + evrctl
#   ghcr.io/4evrd/evrd-web  the web app (nginx + static SPA)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0" # pure Go, like the image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Build core + cli
        run: |
          go build ./cmd/evrd
          go build ./cmd/evrctl
      - name: Test
        run: go test ./...

  # History and cluster tests against a real ScyllaDB (dev/ci-scylla.sh starts
  # one in Docker and runs the tests next to it).
  scylla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test against ScyllaDB
        run: dev/ci-scylla.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # pnpm 11 needs node:sqlite (Node 22+)
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: svelte-check
        run: pnpm check
      - name: Build
        run: pnpm build

  # Playwright against the whole dev stack (docker-compose.dev.yml): two evrd
  # nodes, Postgres, ScyllaDB, VictoriaMetrics, an ergo upstream and the web app.
  e2e:
    runs-on: ubuntu-latest
    needs: [core, web]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web deps + Chromium
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Start the dev stack
        run: docker compose -f docker-compose.dev.yml up -d --build
      - name: Wait for evrd
        run: |
          for i in $(seq 1 120); do
            curl -sf http://localhost:5173/api/config >/dev/null && exit 0
            sleep 5
          done
          docker compose -f docker-compose.dev.yml logs --tail 80
          exit 1
      - name: Playwright
        working-directory: web
        run: pnpm exec playwright test --reporter=github,line
      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail 300
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  # --- images: main and tags only (skipped, not failed, on PRs) -------------
  images:
    runs-on: ubuntu-latest
    needs: [core, scylla, web]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: evrd
            context: .
          - image: evrd-web
            context: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
