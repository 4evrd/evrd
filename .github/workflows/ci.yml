name: ci

# Build and test everything on every push and pull request. On main, once
# everything passes, semantic-release cuts a release from the Conventional
# Commits since the last one (tag vX.Y.Z + GitHub release), and multi-arch
# images go to GHCR — tagged latest, the commit sha, and the version:
#   ghcr.io/4evrd/evrd      the daemon + evrctl
#   ghcr.io/4evrd/evrd-web  the web app (nginx + static SPA)
# A release also gets archives for installing without Docker (binaries).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Pull requests: commit messages follow Conventional Commits (they decide
  # the next version).
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  core:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0" # pure Go, like the image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Build core + cli
        run: |
          go build ./cmd/evrd
          go build ./cmd/evrctl
      # Coverage: the total and each package in the run's summary, the full
      # HTML report as an artifact, and a floor the total mustn't drop below.
      - name: Test, with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./... | tee test.out
      - name: Coverage
        env:
          FLOOR: "50" # percent of statements; raise it as tests are added
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          {
            echo "### Go coverage: ${total}%"
            echo
            echo "| Package | Coverage |"
            echo "|---|---:|"
            awk '/coverage:/ { for (i=1;i<=NF;i++) if ($i=="coverage:") { sub("github.com/4evrd/evrd/","",$2); print "| " $2 " | " $(i+1) " |" } }' test.out | sort
            echo
            echo "Unit tests only — the ScyllaDB tests and e2e run elsewhere. Full report: the coverage-go artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html=coverage.out -o coverage.html
          echo "Go coverage ${total}% (floor ${FLOOR}%)"
          awk -v t="$total" -v f="$FLOOR" 'BEGIN { exit !(t+0 >= f+0) }' || { echo "::error::Go coverage ${total}% is below the ${FLOOR}% floor"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-go
          path: |
            coverage.out
            coverage.html
            test.out
          retention-days: 30

  # A comment on the pull request with its coverage, against main's (from
  # main's last green run). One comment, updated on every push. Not for PRs
  # from forks, whose token can't comment.
  coverage:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [core, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # main's coverage artifact
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-go
          path: pr
      - uses: actions/download-artifact@v4
        with:
          name: coverage-web
          path: pr
      - name: main's coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci --branch main --event push --status success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$id" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -n coverage-go -D base; then echo "main: run $id"; else echo "no coverage from main yet"; fi
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          base=; [ -f base/coverage.out ] && base=base
          sh scripts/coverage-comment.sh pr $base > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q '.[] | select(.body | startswith("<!-- evrd-coverage -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi

  # History and cluster tests against a real ScyllaDB (dev/ci-scylla.sh starts
  # one in Docker and runs the tests next to it).
  scylla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test against ScyllaDB
        run: dev/ci-scylla.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # pnpm 11 needs node:sqlite (Node 22+)
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: svelte-check
        run: pnpm check
      - name: Unit tests, with coverage
        run: |
          pnpm test:coverage 2>&1 | tee coverage.txt
          { echo "### Web unit test coverage"; echo; echo '```'; grep -E "^(ℹ|#) " coverage.txt | grep -E "file|---|\.js|all files" | sed -E 's/^(ℹ|#) //'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: web/coverage.txt
          retention-days: 30
      - name: Build
        run: pnpm build

  # Playwright against the whole dev stack (docker-compose.dev.yml): two evrd
  # nodes, Postgres, ScyllaDB, VictoriaMetrics, an ergo upstream and the web app.
  # Sharded four ways; each shard runs its own stack on its own runner.
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: [core, web]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      COMPOSE: -f docker-compose.dev.yml -f docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # Chromium, kept between runs (the OS packages it needs still install)
      - uses: actions/cache@v4
        id: chromium
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install web deps + Chromium
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          if [ "${{ steps.chromium.outputs.cache-hit }}" = true ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - uses: docker/setup-buildx-action@v3
        id: buildx
      # Go's module and build caches for the image build, kept between runs:
      # without them every dependency compiles again in each shard.
      - uses: actions/cache@v4
        id: gocache
        with:
          path: docker-go-cache
          key: docker-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            docker-go-${{ hashFiles('go.sum') }}-
            docker-go-
      - uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            { "docker-go-cache/mod": "/go/pkg/mod", "docker-go-cache/build": "/root/.cache/go-build" }
          # one shard saves the cache for the next run
          skip-extraction: ${{ steps.gocache.outputs.cache-hit == 'true' || matrix.shard != 1 }}
      # evrd runs the production image here (docker-compose.e2e.yml) rather
      # than compiling under air at startup.
      - name: Build the evrd image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: evrd-e2e
          cache-from: type=gha,scope=evrd-e2e
          cache-to: type=gha,mode=max,scope=evrd-e2e
      - name: Start the stack
        run: docker compose $COMPOSE up -d --no-build
      - name: Wait for evrd
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/api/config >/dev/null &&
              curl -sf http://localhost:8198/api/config >/dev/null && exit 0
            sleep 5
          done
          docker compose $COMPOSE ps
          docker compose $COMPOSE logs --tail 80
          exit 1
      - name: Playwright
        working-directory: web
        env:
          E2E_EVRCTL: docker compose -f ../docker-compose.dev.yml -f ../docker-compose.e2e.yml exec -T evrd evrctl -config /src/deploy/evrd.dev.conf
          # the standalone node with the connection holder (holder.spec.js)
          E2E_COMPOSE: docker compose -f ../docker-compose.dev.yml -f ../docker-compose.e2e.yml
          E2E_SOLO_EVRCTL: docker compose -f ../docker-compose.dev.yml -f ../docker-compose.e2e.yml exec -T evrd-solo evrctl -config /src/deploy/evrd.solo.conf
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/4 --reporter=github,line
      - name: Stack logs
        if: failure()
        run: docker compose $COMPOSE logs --tail 300
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: web/test-results
          retention-days: 7

  # --- release + images: pushes to main only (skipped on PRs) --------------
  release:
    runs-on: ubuntu-latest
    needs: [core, scylla, web, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # tags and GitHub releases
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24.2.0
          extra_plugins: |
            conventional-changelog-conventionalcommits@8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Release archives for running without Docker (OpenBSD's install.sh uses
  # them): evrd, evrctl and the web app per OS/arch, with BSD-style SHA256.
  binaries:
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write # upload to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # setup-go's cache is shared with the test jobs, which save it
          # first, without the release platforms; this job keeps its own
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: dist-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            dist-go-${{ hashFiles('go.sum') }}-
            dist-go-
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the web app
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build the archives
        run: scripts/dist.sh ${{ needs.release.outputs.version }}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v${{ needs.release.outputs.version }} dist/*.tar.gz dist/SHA256 --clobber

  images:
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: evrd
            context: .
          - image: evrd-web
            context: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - uses: actions/cache@v4
        if: matrix.image == 'evrd'
        id: gocache
        with:
          path: docker-go-cache
          key: docker-go-multi-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            docker-go-multi-${{ hashFiles('go.sum') }}-
            docker-go-multi-
      - uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        if: matrix.image == 'evrd'
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            { "docker-go-cache/mod": "/go/pkg/mod", "docker-go-cache/build": "/root/.cache/go-build" }
          skip-extraction: ${{ steps.gocache.outputs.cache-hit == 'true' }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.published == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.published == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.published == 'true' && needs.release.outputs.version || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
