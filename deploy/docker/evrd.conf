# evrd configuration. One directive per line; # starts a comment.
# Most of these can also be changed later in the web app (Admin → Settings).

# --- where evrd listens -------------------------------------------------------
listen ircs://:6697             # IRC over TLS (clients attach here)
# listen irc+insecure://:6667   # plain IRC (also publish 6667 in docker-compose.yml)
api :8098                       # web API (the web container proxies to it)

# TLS for IRC. Without these evrd makes a self-signed certificate at startup
# (clients will ask you to accept it). Mount your certs into the container:
# tls_cert /etc/evrd/certs/fullchain.pem
# tls_key  /etc/evrd/certs/privkey.pem

# --- storage ------------------------------------------------------------------
# The database comes from EVRD_DB in docker-compose.yml.
history pebble:/var/lib/evrd/history   # chat history on the evrd-data volume

# --- how users reach you ------------------------------------------------------
public_url https://bnc.example.org   # the web app's address (single sign-on returns here)
irc_host   bnc.example.org           # the host name users give their IRC client
cookie_secure yes                    # set to no only while testing over plain http
# The web container (nginx) reaches evrd over Docker's network: believe the
# browser address it passes on (X-Forwarded-For). evrd's API port isn't
# published, so only containers can reach it.
trusted_proxies 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16

# --- accounts -----------------------------------------------------------------
password_login yes
max_networks 0      # per user, 0 = unlimited
max_clients  0      # attached IRC clients per user, 0 = unlimited
backlog_lines 2000  # kept per channel / query

# Single sign-on (OpenID Connect: Logto, Authentik, Keycloak, …):
# oidc_issuer       https://id.example.org/oidc
# oidc_client_id    <client id>
# oidc_client_secret <secret>   # or EVRD_OIDC_CLIENT_SECRET
# oidc_label        Example ID

# --- metrics (with: docker compose --profile metrics up -d) --------------------
# otel_endpoint http://victoriametrics:8428/opentelemetry/v1/metrics
# metrics_url   http://victoriametrics:8428

# Settings changed in the web app live in the database. To also write them
# back into this file, mount this directory (not just the file) writable by
# uid 1000 and turn this on (single node only):
settings_write_conf no
