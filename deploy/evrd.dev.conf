# evrd development config (used by docker-compose).
# See internal/config for the full set of directives.

# Where native IRC clients attach: plaintext on 6667, TLS on 6697.
# (No tls_cert/tls_key set, so evrd uses a self-signed cert in dev.)
listen irc+insecure://:6667
listen ircs://:6697

# HTTP/WebSocket API for the web app (proxied by vite on :5173).
api :8098

# Accounts and settings: the compose Postgres.
db postgres://evrd:evrd@postgres:5432/evrd?sslmode=disable

# Chat history: the compose ScyllaDB, shared by every evrd node. For a
# single-node install without ScyllaDB, use an embedded store instead:
#   history pebble:/var/lib/evrd/history
history scylla://scylla:9042/evrd?replication=1

# The web app's address, and the host clients are told to attach to.
public_url http://localhost:5173
irc_host localhost

# Sign-in. Dev runs over plain HTTP, so the session cookie can't be Secure.
password_login yes
cookie_secure no

# To try SSO, point these at a Logto (or any OIDC) app whose redirect URI is
# http://localhost:5173/auth/callback, and set EVRD_OIDC_CLIENT_SECRET.
# oidc_issuer https://id.example.org/oidc
# oidc_client_id ...
# oidc_label IRCforever account
# oidc_admin_role evrd-admin

# Metrics: OpenTelemetry export to VictoriaMetrics, and where the dashboards
# read them back from.
otel_endpoint http://victoriametrics:8428/opentelemetry/v1/metrics
otel_interval 15s
metrics_url   http://victoriametrics:8428

# Default per-user limits (0 = unlimited); admins can override per user.
max_networks 0
max_clients 5
backlog_lines 2000

# Cluster: every node runs this file; each sets its own EVRD_NODE_ID,
# EVRD_INTERNAL_URL and EVRD_INTERNAL_IRC_ADDR (see docker-compose), and
# EVRD_CLUSTER_SECRET. The internal ports are only reachable between nodes.
internal_listen :8099
internal_irc_listen :6699
