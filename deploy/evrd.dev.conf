# evrd development config (used by docker-compose).
# See internal/config for the full set of directives.

# Where native IRC clients attach: plaintext on 6667, TLS on 6697.
# (No tls_cert/tls_key set, so evrd uses a self-signed cert in dev.)
listen irc+insecure://:6667
listen ircs://:6697

# Admin/client API (HTTP + WebSocket) for the web app.
api :8098

# Storage.
db sqlite:/var/lib/evrd/evrd.db
