# InspIRCd 3 for the dev stack and e2e (docker-compose.dev.yml: inspircd),
# linked to Anope (services). Where ergo has its services built in, these
# are a separate server, as on most networks: an IDENTIFY takes a round
# trip over the link, and a JOIN sent right behind it gets there first.
# It also has oper-only channels (+O, operchans). Dev only: the passwords
# are in the clear.

<server name="irc.evrd.test" description="evrd dev/e2e InspIRCd" network="EvrdTest">
<admin name="evrd" nick="evrd" email="evrd@evrd.test">

<bind address="" port="6667" type="clients">
<bind address="" port="7000" type="servers">

# Every evrd user connects from evrd's address: no clone limits, no fake lag.
<connect name="main" allow="*" maxchans="100" timeout="30" pingfreq="2m"
         hardsendq="4M" softsendq="1M" recvq="64K" threshold="1000" commandrate="100000"
         fakelag="off" localmax="10000" globalmax="10000" resolvehostnames="no"
         useident="no" limit="10000">
<cidr ipv4clone="32" ipv6clone="128">
<performance clonesonconnect="no">
<dns timeout="1">
<options casemapping="ascii" syntaxhints="no" defaultmodes="not">
<security hideulines="no" genericoper="no">

# The oper e2e tests use (OPER evrd e2e-oper-pw).
<class name="all" commands="*" privs="*" usermodes="*" chanmodes="*">
<type name="Admin" classes="all">
<oper name="evrd" password="e2e-oper-pw" host="*@*" type="Admin">

# Anope (services in docker-compose.dev.yml)
<link name="services.localhost.net" ipaddr="services" port="7000" allowmask="*"
      sendpass="evrd-dev-link" recvpass="evrd-dev-link">
<uline server="services.localhost.net" silent="yes">

<module name="spanningtree">
<module name="services_account">
<module name="operchans">
<module name="chghost">
<module name="chgident">
<module name="chgname">
<module name="hidechans">
<module name="cap">
<module name="svshold">
<module name="cban">
<module name="globops">

<log method="file" type="* -USERINPUT -USEROUTPUT" level="default" target="/dev/stdout">
