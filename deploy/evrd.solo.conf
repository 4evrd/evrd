# A standalone evrd for the dev stack and the e2e suite: one node (no
# cluster), SQLite and Pebble, and its IRC connections kept by the connection
# holder (the links service), so restarting it keeps everyone on IRC.
listen irc+insecure://:6667
api :8098
db sqlite:/var/lib/evrd/solo.db
history pebble:/var/lib/evrd/solo-history
public_url http://localhost:8198
irc_host localhost
password_login yes
cookie_secure no
max_networks 0
max_clients 0
links_socket /run/evrd-links/links.sock
