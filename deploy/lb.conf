# Load balancer in front of the evrd nodes (docker compose). Round-robin on
# purpose: any node can take any request — it forwards to the user's owner.

worker_processes 1;
events { worker_connections 4096; }

# A node that fails a connection is skipped for 10s, and connecting gives up
# after 2s, so a dead node costs a client a moment, not a minute.

# IRC: plain TCP passthrough (TLS on 6697 terminates at evrd).
stream {
    upstream evrd_irc     { server evrd:6667 max_fails=1 fail_timeout=10s; server evrd2:6667 max_fails=1 fail_timeout=10s; }
    upstream evrd_irc_tls { server evrd:6697 max_fails=1 fail_timeout=10s; server evrd2:6697 max_fails=1 fail_timeout=10s; }
    proxy_connect_timeout 2s;
    server { listen 6667; proxy_pass evrd_irc; }
    server { listen 6697; proxy_pass evrd_irc_tls; }
}

http {
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    upstream evrd_api { server evrd:8098 max_fails=1 fail_timeout=10s; server evrd2:8098 max_fails=1 fail_timeout=10s; }
    server {
        listen 8098;
        location / {
            proxy_pass http://evrd_api;
            proxy_connect_timeout 2s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;     # the chat WebSocket
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1h;
        }
    }
}
