name: ci

# Build and test all three parts on every push/PR. On a push to main, also
# build and push container images to the Forgejo registry. No deployment — the
# images are published for later use.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet
        run: go vet ./...
      - name: Build core + cli
        run: |
          go build ./cmd/evrd
          go build ./cmd/evrctl
      - name: Test
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # pnpm 11 needs node:sqlite (Node 22+)
      - name: Install pnpm
        run: npm install -g pnpm@11.8.0
      - name: Build web
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build

  # --- images: main only (skipped, not failed, on PRs) ----------------------
  image-core:
    runs-on: ubuntu-latest
    needs: core
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_API_VERSION: "1.44"
    steps:
      - uses: actions/checkout@v4
      - name: Install Docker CLI
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends docker.io
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: code.ircforever.org
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            code.ircforever.org/${{ github.repository }}:latest
            code.ircforever.org/${{ github.repository }}:${{ github.sha }}

  image-web:
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_API_VERSION: "1.44"
    steps:
      - uses: actions/checkout@v4
      - name: Install Docker CLI
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends docker.io
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: code.ircforever.org
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            code.ircforever.org/${{ github.repository }}-web:latest
            code.ircforever.org/${{ github.repository }}-web:${{ github.sha }}
