name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet
        run: go vet ./...
      - name: Build core + cli
        run: |
          go build ./cmd/evrd
          go build ./cmd/evrctl
      - name: Test
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # pnpm 11 needs node:sqlite (Node 22+)
      - name: Install pnpm
        run: npm install -g pnpm@11.8.0
      - name: Build web
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
