# ngircd with Anope linked in, for dev/e2e-managed.sh (the nick guard):
# WEBIRC for evrd in managed mode, no per-address connection limit.
[Global]
	Name = irc.ngircd.test
	Info = managed mode e2e
	Ports = 6667
	MotdPhrase = ngircd test server
	ServerUID = irc

[Limits]
	MaxConnectionsIP = 0
	MaxNickLength = 30

[Options]
	WebIRCPassword = webirc-secret
	DNS = no
	Ident = no
	PAM = no

[Server]
	Name = services.ngircd.test
	MyPassword = e2e-link
	PeerPassword = e2e-link
	ServiceMask = *Serv,Global
