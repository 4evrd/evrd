/* Anope 2.0 for dev/ngircd-anope: NickServ only, linked to the ngircd in the same container. */
define
{
	name = "services.host"
	value = "services.ngircd.test"
}
uplink
{
	host = "127.0.0.1"
	ipv6 = no
	ssl = no
	port = 6667
	password = "e2e-link"
}
serverinfo
{
	name = "services.ngircd.test"
	description = "Services"
	pid = "/run/anope/anope.pid"
	motd = "/etc/anope/services.motd"
}
module { name = "ngircd" }
networkinfo
{
	networkname = "NgircdNet"
	nicklen = 16
	userlen = 10
	hostlen = 64
	chanlen = 32
	modelistsize = 100
	vhost_chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-"
	allow_undotted_vhosts = false
	disallow_start_or_end = ".-"
}
options
{
	casemap = "ascii"
	badpasslimit = 50
	badpasstimeout = 1h
	updatetimeout = 30s
	expiretimeout = 30m
	readtimeout = 5s
	warningtimeout = 4h
	timeoutcheck = 3s
	retrywait = 2s
	hideprivilegedcommands = yes
	hideregisteredcommands = yes
}
include
{
	type = "file"
	name = "nickserv.conf"
}
log
{
	target = "services.log"
	admin = "*"
	commands = "*"
	servers = "*"
	users = "connect disconnect nick"
	other = "*"
}
mail { usemail = no }
module
{
	name = "db_flatfile"
	database = "anope.db"
	fork = no
}
module { name = "enc_sha256" }
