# ngircd for dev/e2e-managed.sh: WEBIRC for evrd in managed mode, and no
# per-address connection limit (every managed user comes from evrd's).
[Global]
	Name = irc.ngircd.test
	Info = managed mode e2e
	Ports = 6667
	MotdPhrase = ngircd test server

[Limits]
	MaxConnectionsIP = 0

[Options]
	WebIRCPassword = webirc-secret
	DNS = no
	Ident = no
	PAM = no
