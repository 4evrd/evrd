name: evrd-dev

# Hot-reload development stack (the default `make up`):
#   - evrd: air rebuilds + restarts the Go binary on .go changes
#   - web:  vite dev server with HMR on source changes
# Both bind-mount the source; named volumes hold caches/node_modules so host
# files never clobber what's installed inside the containers.

services:
  scylla:
    image: scylladb/scylla:6.2
    # One small node for development: one core, little memory, no tuning checks.
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null"]
      interval: 5s
      retries: 60
    # internal only — evrd reaches it as scylla:9042

  # Metrics: evrd pushes OpenTelemetry (OTLP) here and reads it back for the
  # dashboards. Prometheus naming makes evrd.irc.lines evrd_irc_lines_total.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.1
    command:
      - -retentionPeriod=90d
      - -storageDataPath=/storage
      - -opentelemetry.usePrometheusNaming
    volumes:
      - vm-data:/storage
    # internal only — evrd reaches it as victoriametrics:8428

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evrd
      POSTGRES_PASSWORD: evrd
      POSTGRES_DB: evrd
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "evrd"]
      interval: 2s
      retries: 30
    # internal only — evrd reaches it as postgres:5432

  ircd:
    image: ghcr.io/ergochat/ergo:stable # internal upstream (ircd:6667)
    # Every evrd user connects from evrd's one address: turn off ergo's
    # per-IP connection count and throttle (the e2e suite alone opens dozens
    # of connections). Its env overrides don't reach these, so edit the config
    # the image generates before starting it.
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -f /ircd/ircd.yaml ] || sed 's/path: languages/path: \/ircd-bin\/languages/' /ircd-bin/default.yaml > /ircd/ircd.yaml
        sed -i 's/^        count: true/        count: false/; s/^        throttle: true/        throttle: false/' /ircd/ircd.yaml
        exec /ircd-bin/run.sh

  # Two evrd nodes, both live-reloading from the source. Users are spread
  # across them; the load balancer sends anyone anywhere.
  evrd:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      EVRD_NODE_ID: node-a
      EVRD_INTERNAL_URL: http://evrd:8099
      EVRD_INTERNAL_IRC_ADDR: evrd:6699
      EVRD_CLUSTER_SECRET: dev-cluster-secret
      # Encrypts saved network passwords. A dev-only key: make your own with
      # `evrctl genkey` for anything real.
      EVRD_SECRET_KEY: lziNkka9EHHENdp2LKv88ym6zYCRfH8cMo6rZj/Ihi4=
    depends_on:
      ircd:
        condition: service_started
      postgres:
        condition: service_healthy
      scylla:
        condition: service_healthy
    volumes:
      - .:/src
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
      - evrd-data:/var/lib/evrd

  evrd2:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Its own build directory, so the two nodes' rebuilds don't collide.
    command: ["air", "-c", "dev/air.toml", "-tmp_dir", "tmp/b", "-build.cmd", "go build -buildvcs=false -o ./tmp/b/evrd ./cmd/evrd", "-build.bin", "tmp/b/evrd"]
    environment:
      EVRD_NODE_ID: node-b
      EVRD_INTERNAL_URL: http://evrd2:8099
      EVRD_INTERNAL_IRC_ADDR: evrd2:6699
      EVRD_CLUSTER_SECRET: dev-cluster-secret
      # Encrypts saved network passwords. A dev-only key: make your own with
      # `evrctl genkey` for anything real.
      EVRD_SECRET_KEY: lziNkka9EHHENdp2LKv88ym6zYCRfH8cMo6rZj/Ihi4=
    depends_on:
      ircd:
        condition: service_started
      postgres:
        condition: service_healthy
      scylla:
        condition: service_healthy
    volumes:
      - .:/src
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod

  # A standalone evrd (no cluster) whose IRC connections live in the
  # connection holder (links): restart it and its users stay on IRC. The API
  # is on localhost:8198 (e2e/holder.spec.js).
  #
  # evrd-solo shares the holder's network namespace, like containers in a
  # pod: the IRC sockets evrd opens (and hands over) belong to it, and must
  # outlive evrd-solo's restarts — its own namespace goes when it stops.
  links:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["go", "run", "./cmd/evrd-links", "-socket", "/run/evrd-links/links.sock"]
    volumes:
      - .:/src
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
      - links-sock:/run/evrd-links
    ports:
      - "8198:8098" # evrd-solo's API (it uses this network namespace)

  evrd-solo:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["go", "run", "./cmd/evrd", "-config", "deploy/evrd.solo.conf"]
    environment:
      EVRD_SECRET_KEY: lziNkka9EHHENdp2LKv88ym6zYCRfH8cMo6rZj/Ihi4=
    network_mode: "service:links"
    depends_on:
      ircd:
        condition: service_started
      links:
        condition: service_started
    volumes:
      - .:/src
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
      - solo-data:/var/lib/evrd
      - links-sock:/run/evrd-links

  # Round-robin load balancer for IRC and the API (deploy/lb.conf).
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - evrd
      - evrd2
    ports:
      - "6667:6667"
      - "6697:6697" # IRC
      - "8098:8098" # HTTP/WebSocket API (the web app reaches it through vite)

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host --port 5173"
    environment:
      EVRD_API: http://lb:8098 # vite proxies /api + /auth here, via the load balancer
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  vm-data:
  pg-data:
  scylla-data:
  go-build-cache:
  go-mod-cache:
  evrd-data:
  solo-data:
  links-sock:
  web-node-modules:
