# Layered on docker-compose.dev.yml for CI's end-to-end run: both evrd nodes
# run the production image instead of compiling under air at startup.
#
#   docker compose -f docker-compose.dev.yml -f docker-compose.e2e.yml up -d --build
services:
  evrd:
    build:
      context: .
      dockerfile: Dockerfile
    image: evrd-e2e
    entrypoint: ["evrd", "-config", "/src/deploy/evrd.dev.conf"]
    command: []
  evrd2:
    image: evrd-e2e
    build: !reset null
    pull_policy: never
    entrypoint: ["evrd", "-config", "/src/deploy/evrd.dev.conf"]
    command: []
    depends_on:
      evrd:
        condition: service_started
  # The standalone node and its connection holder, from the same image.
  # Both start as root and drop to evrd, as a server binding ports below
  # 1024 does: evrd then binds its ports before dropping, and must leave the
  # IRC listener the holder kept alone (holder.spec.js restarts it).
  links:
    image: evrd-e2e
    build: !reset null
    pull_policy: never
    user: "0:0"
    entrypoint: ["evrd-links", "-socket", "/run/evrd-links/links.sock", "-user", "evrd"]
    command: []
    depends_on:
      evrd:
        condition: service_started
  evrd-solo:
    image: evrd-e2e
    build: !reset null
    pull_policy: never
    user: "0:0"
    entrypoint: ["sh", "-c", "{ cat /src/deploy/evrd.solo.conf; echo 'user evrd'; } >/tmp/solo.conf && exec evrd -config /tmp/solo.conf"]
    command: []
    depends_on:
      evrd:
        condition: service_started
      links:
        condition: service_started
